<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CV Optimizer</title>
    <style>
        body { width: 320px; padding: 15px; font-family: sans-serif; }
        h3 { margin-top: 0; text-align: center; }
        button {
            width: 100%;
            padding: 12px;
            background: #0a66c2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
        .error { color: #d93025; }
        .success { color: #1e8e3e; }

        details {
            margin-top: 18px;
            border-top: 1px solid #e0e0e0;
            padding-top: 10px;
        }
        summary { cursor: pointer; font-weight: bold; color: #555; font-size: 13px; }
        .field { margin: 10px 0; }
        .field label { display: block; font-size: 12px; color: #555; margin-bottom: 3px; }
        .field input, .field textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            font-family: sans-serif;
        }
        #manual-btn { background: #555; margin-top: 4px; }
    </style>
</head>
<body>
    <h3>CV Optimizer</h3>
    <button id="extract-btn">Optimize for this Job</button>
    <div id="status"></div>

    <details id="manual-section">
        <summary>Manual entry (unsupported boards)</summary>
        <div class="field">
            <label>Company</label>
            <input type="text" id="m-company" placeholder="e.g. Netflix">
        </div>
        <div class="field">
            <label>Role</label>
            <input type="text" id="m-role" placeholder="e.g. Senior UI Engineer">
        </div>
        <div class="field">
            <label>Job description</label>
            <textarea id="m-jd" rows="10" placeholder="Paste the job description text..."></textarea>
        </div>
        <div class="field">
            <label>URL (optional)</label>
            <input type="text" id="m-url" placeholder="https://...">
        </div>
        <button id="manual-btn">Track this job</button>
    </details>

    <script src="popup.js"></script>
</body>
</html>
