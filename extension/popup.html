<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CV Optimizer</title>
    <style>
        body { width: 300px; padding: 15px; font-family: sans-serif; }
        h3 { margin-top: 0; text-align: center; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #0a66c2; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-weight: bold;
        }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
        .error { color: #d93025; }
        .success { color: #1e8e3e; }
    </style>
</head>
<body>
    <h3>CV Optimizer</h3>
    <button id="extract-btn">Optimize for this Job</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
