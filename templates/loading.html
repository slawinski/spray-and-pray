<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP — Loading</title>
  <style>
    :root {
      --bg: #0d1117;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Loader ── */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* ── Spectrum — frequency analyzer bars ── */
    .spectrum {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 40px;
    }

    .bar {
      width: 4px;
      height: 100%;
      background: var(--border);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .processing .bar {
      background: transparent;
    }

    .bar-signal {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(
        to top,
        var(--accent) 0%,
        rgba(88, 166, 255, 0.45) 60%,
        rgba(88, 166, 255, 0.08) 100%
      );
      border-radius: 2px;
      height: 100%;
      animation: bar-breathe var(--dur, 2s) cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    .bar-glow {
      position: absolute;
      bottom: 0;
      left: -3px;
      right: -3px;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      opacity: 0.1;
      filter: blur(7px);
      animation: bar-breathe var(--dur, 2s) cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    @keyframes bar-breathe {
      0%   { height: 15%; }
      100% { height: 100%; }
    }

    /* ── Done state ── */
    .done .bar-signal {
      animation: bar-fill 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .done .bar-glow {
      animation: bar-fill 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .done .bar:nth-child(1) .bar-signal,
    .done .bar:nth-child(1) .bar-glow { animation-delay: 0.00s; }
    .done .bar:nth-child(2) .bar-signal,
    .done .bar:nth-child(2) .bar-glow { animation-delay: 0.06s; }
    .done .bar:nth-child(3) .bar-signal,
    .done .bar:nth-child(3) .bar-glow { animation-delay: 0.12s; }
    .done .bar:nth-child(4) .bar-signal,
    .done .bar:nth-child(4) .bar-glow { animation-delay: 0.18s; }
    .done .bar:nth-child(5) .bar-signal,
    .done .bar:nth-child(5) .bar-glow { animation-delay: 0.24s; }

    @keyframes bar-fill {
      0%   { background: var(--accent); opacity: 1; }
      100% { background: #3fb950; opacity: 1; }
    }

    .done .bar {
      background: rgba(63, 185, 80, 0.08);
      transition: background 0.5s ease;
    }

    /* ── Error state ── */
    .error .bar-signal {
      animation: none;
      height: 25%;
      background: #f85149;
    }

    .error .bar-glow {
      animation: none;
      height: 25%;
      background: #f85149;
      opacity: 0.12;
    }

    .error .bar {
      background: rgba(248, 81, 73, 0.06);
    }

    /* ── Status text ── */
    .status {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 54px;
    }

    .status-label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .status-phase {
      font-size: 0.9375rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.45;
      animation: text-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.4;
      animation: text-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes text-in {
      0%   { opacity: 0; transform: translateY(3px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ── Fade-out on redirect ── */
    body.fade-out {
      opacity: 0;
    }

    .error .status-label { color: #f85149; }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .bar-signal {
        animation: none;
        height: 50%;
      }
      .bar-glow {
        animation: none;
        height: 50%;
        opacity: 0.06;
      }
      .status-phase,
      .status-sub {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="loader processing" id="loader">
    <div class="spectrum">
      <div class="bar">
        <div class="bar-signal" style="--dur: 1.8s; --delay: 0.0s;"></div>
        <div class="bar-glow"   style="--dur: 1.8s; --delay: 0.0s;"></div>
      </div>
      <div class="bar">
        <div class="bar-signal" style="--dur: 1.5s; --delay: -0.3s;"></div>
        <div class="bar-glow"   style="--dur: 1.5s; --delay: -0.3s;"></div>
      </div>
      <div class="bar">
        <div class="bar-signal" style="--dur: 2.0s; --delay: -0.6s;"></div>
        <div class="bar-glow"   style="--dur: 2.0s; --delay: -0.6s;"></div>
      </div>
      <div class="bar">
        <div class="bar-signal" style="--dur: 1.6s; --delay: -0.9s;"></div>
        <div class="bar-glow"   style="--dur: 1.6s; --delay: -0.9s;"></div>
      </div>
      <div class="bar">
        <div class="bar-signal" style="--dur: 2.2s; --delay: -1.2s;"></div>
        <div class="bar-glow"   style="--dur: 2.2s; --delay: -1.2s;"></div>
      </div>
    </div>

    <div class="status" id="status">
      <div class="status-label" id="status-label">Initializing</div>
      <div class="status-phase" id="status-phase">Establishing connection...</div>
      <div class="status-sub" id="status-sub">DeepSeek API</div>
    </div>
  </div>

  <script id="load-params" type="application/json">
    {{ params | tojson }}
  </script>
  <script>
    (function() {
      var raw = document.getElementById("load-params").textContent;
      var params = JSON.parse(raw);
      var action = params.action;
      var appId = params.app_id;
      var concept = params.concept || "";
      var context = params.context || "";
      var sessionId = params.session_id || null;

      var loader = document.getElementById("loader");
      var statusLabel = document.getElementById("status-label");
      var statusPhase = document.getElementById("status-phase");
      var statusSub = document.getElementById("status-sub");

      function setPhase(label, phase, sub) {
        if (label) statusLabel.textContent = label;
        statusPhase.textContent = phase;
        if (sub) statusSub.textContent = sub;
        statusPhase.style.animation = "none";
        statusPhase.offsetHeight;
        statusPhase.style.animation = "";
        if (sub) {
          statusSub.style.animation = "none";
          statusSub.offsetHeight;
          statusSub.style.animation = "";
        }
      }

      function setError(msg) {
        loader.classList.remove("processing");
        loader.classList.add("error");
        setPhase("Error", msg, "Check the server logs or try again");
      }

      function doneAndRedirect(url) {
        setPhase("Ready", "Redirecting...", url);
        loader.classList.remove("processing");
        loader.classList.add("done");
        document.body.classList.add("fade-out");
        setTimeout(function() {
          window.location.href = url;
        }, 650);
      }

      setPhase("Connecting", "Contacting API...",
        action === "interview" ? "Preparing mock interview" : "Researching concept");

      if (action === "interview" && appId) {
        setPhase("Generating", "Generating interview questions...",
          "Analyzing job description & company intel");

        fetch("/api/interview/" + appId + "/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        })
        .then(function(resp) {
          if (!resp.ok) throw new Error("Server returned " + resp.status);
          return resp.json();
        })
        .then(function(data) {
          setPhase("Processing", "Interview ready", "Opening session...");
          doneAndRedirect(data.session_url || "/interview/" + data.session_id);
        })
        .catch(function(err) {
          setError(err.message);
        });

      } else if (action === "learn" && concept) {
        setPhase("Generating", "Creating lesson: " + concept,
          "Researching concept, building examples, charts & diagrams");

        var payload = JSON.stringify({
          concept: concept,
          context: context,
          session_id: sessionId ? parseInt(sessionId, 10) : null
        });

        fetch("/api/learn/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload
        })
        .then(function(resp) {
          if (!resp.ok) throw new Error("Server returned " + resp.status);
          return resp.json();
        })
        .then(function(data) {
          setPhase("Processing", "Assembling lesson...",
            "Preparing content & interactive elements");
          var lessonUrl = data.url || "/learn/" + data.lesson_id;
          doneAndRedirect(lessonUrl);
        })
        .catch(function(err) {
          setError(err.message);
        });

      } else {
        setError("Missing parameters.");
      }
    })();
  </script>
</body>
</html>
