<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Interview — {{ company }} — {{ role }}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-alt: #1c2128;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --accent-muted: rgba(88, 166, 255, 0.08);
      --accent-border: rgba(88, 166, 255, 0.18);
      --green: #3fb950;
      --yellow: #d2991d;
      --yellow-muted: rgba(210, 153, 29, 0.08);
      --yellow-border: rgba(210, 153, 29, 0.25);
      --red: #f85149;
      --radius: 8px;
      --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 68ch;
      margin: 0 auto;
      padding: 40px 20px 80px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    header .meta {
      color: var(--text-dim);
      font-size: 0.875rem;
      margin-top: 2px;
    }
    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8125rem;
      color: var(--text-dim);
      white-space: nowrap;
      padding-top: 4px;
    }
    .progress-bar {
      width: 110px;
      height: 5px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }

    /* ── Question card ── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: var(--accent-muted);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }
    .badge.coding {
      background: rgba(63, 185, 80, 0.1);
      color: var(--green);
      border-color: rgba(63, 185, 80, 0.25);
    }
    .prompt {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .context {
      font-size: 0.8125rem;
      color: var(--text-dim);
      margin-bottom: 16px;
      line-height: 1.55;
    }
    .time-estimate {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    /* ── Answer area ── */
    textarea {
      width: 100%;
      min-height: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      padding: 12px 14px;
      resize: vertical;
      line-height: 1.55;
      transition: border-color 150ms;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    #monaco-container {
      width: 100%;
      height: 300px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }

    /* ── Hint box ── */
    .hint-box {
      display: none;
      background: var(--yellow-muted);
      border: 1px solid var(--yellow-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-top: 14px;
      font-size: 0.8125rem;
    }
    .hint-box.visible { display: block; }
    .hint-box .concepts {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hint-box .concepts span {
      background: rgba(210, 153, 29, 0.12);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      color: var(--yellow);
    }
    .deep-dive-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.8125rem;
      color: var(--accent);
      text-decoration: none;
      transition: color 150ms;
    }
    .deep-dive-link:hover { color: #79c0ff; }

    /* ── Actions ── */
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }
    .nav-spacer { flex: 1; }
    button {
      padding: 7px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms, border-color 150ms;
    }
    button:hover { background: var(--surface-alt); border-color: var(--text-dim); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button:disabled:hover { background: var(--surface); border-color: var(--border); }
    button.primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.08);
      color: #fff;
    }
    button.primary:hover { background: #2ea043; }
    button.warn {
      background: transparent;
      color: var(--yellow);
      border-color: var(--yellow-border);
    }
    button.warn:hover { background: var(--yellow-muted); }

    /* ── Completed ── */
    .completed-overlay {
      text-align: center;
      padding: 40px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .completed-overlay h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .completed-overlay p {
      color: var(--text-dim);
      font-size: 0.875rem;
      margin-bottom: 20px;
    }

    /* ── Evaluation spinner ── */
    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.88);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 18px;
    }
    .spinner-overlay.visible { display: flex; }
    .spinner-ring {
      width: 44px; height: 44px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-overlay .text {
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
      .spinner-ring { animation-duration: 2s; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });
    require(['vs/editor/editor.main'], function() {
      window.__monacoReady = true;
      if (window.__onMonacoReady) window.__onMonacoReady();
    });
  </script>
</head>
<body>
  <div class="spinner-overlay" id="eval-spinner">
    <div class="spinner-ring"></div>
    <div class="text">Evaluating your answers with LLM...</div>
  </div>

  <header>
    <div>
      <h1>{{ company }}</h1>
      <div class="meta">{{ role }}</div>
    </div>
    <div class="progress">
      <span id="question-counter">Question 1 / {{ questions|length }}</span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </header>

  <div id="app">
    <div class="question-card">
      <div class="badge" id="type-badge">Loading...</div>
      <div class="prompt" id="question-prompt"></div>
      <div class="context" id="question-context"></div>
      <div class="time-estimate" id="time-estimate"></div>

      <div id="answer-area">
        <textarea id="answer-textarea" placeholder="Write your answer..."></textarea>
      </div>
      <div id="monaco-container" style="display:none;"></div>

      <div class="hint-box" id="hint-box">
        <div id="hint-text"></div>
        <div class="concepts" id="hint-concepts"></div>
        <a href="#" class="deep-dive-link" id="hint-deep-dive" style="display:none;">
          Deep Dive: Learn more about "<span id="hint-concept-name"></span>" →
        </a>
      </div>

      <div class="actions">
        <button id="prev-btn" disabled>← Back</button>
        <button id="hint-btn" class="warn">Show Hint</button>
        <div class="nav-spacer"></div>
        <button id="next-btn">Next →</button>
      </div>
    </div>
  </div>

  <div id="completed-section" style="display:none;">
    <div class="completed-overlay">
      <h2>All questions answered</h2>
      <p>Ready to submit for evaluation?</p>
      <button class="primary" id="submit-btn" style="font-size:0.9375rem;padding:10px 28px;">
        Submit for Evaluation
      </button>
    </div>
  </div>

  <script id="session-data" type="application/json">
  {
    "sessionId": {{ session_id }},
    "questions": {{ questions | tojson }},
    "answers": {{ answers | tojson }},
    "evaluated": {{ "true" if evaluated else "false" }}
  }
  </script>
  <script src="/static/interview.js"></script>
</body>
</html>
