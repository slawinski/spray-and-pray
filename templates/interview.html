<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Interview — {{ company }} — {{ role }}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d2991d;
      --red: #f85149;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px;
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header .meta { color: var(--text-dim); font-size: 0.875rem; }
    .progress {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    .progress-bar {
      width: 120px;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 12px;
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
    }
    .badge.coding { background: rgba(63, 185, 80, 0.12); color: var(--green); border-color: rgba(63, 185, 80, 0.3); }
    .prompt {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .context {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      font-size: 0.875rem;
      padding: 12px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    #monaco-container {
      width: 100%;
      height: 320px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .hint-box {
      display: none;
      background: rgba(210, 153, 29, 0.08);
      border: 1px solid rgba(210, 153, 29, 0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.875rem;
    }
    .hint-box.visible { display: block; }
    .hint-box .concepts {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hint-box .concepts span {
      background: rgba(210, 153, 29, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      padding: 8px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #21262d; border-color: var(--text-dim); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }
    button.primary:hover { background: #2ea043; }
    button.warn { background: transparent; color: var(--yellow); border-color: rgba(210, 153, 29, 0.4); }
    .completed-overlay {
      text-align: center;
      padding: 48px 24px;
    }
    .completed-overlay h2 { margin-bottom: 8px; }
    .completed-overlay p { color: var(--text-dim); margin-bottom: 24px; }
    .nav-spacer { flex: 1; }
    .time-estimate { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
    }
    .spinner-overlay.visible { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-overlay .text { color: var(--text-dim); font-size: 0.9rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });
    require(['vs/editor/editor.main'], function() {
      window.__monacoReady = true;
      if (window.__onMonacoReady) window.__onMonacoReady();
    });
  </script>
</head>
<body>
  <div class="spinner-overlay" id="eval-spinner">
    <div class="spinner"></div>
    <div class="text">Evaluating your answers with LLM...</div>
  </div>
  <header>
    <div>
      <h1>{{ company }}</h1>
      <div class="meta">{{ role }}</div>
    </div>
    <div class="progress">
      <span id="question-counter">Question 1 / {{ questions|length }}</span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </header>

  <div id="app">
    <div class="question-card">
      <div class="badge" id="type-badge">Loading...</div>
      <div class="prompt" id="question-prompt"></div>
      <div class="context" id="question-context"></div>
      <div class="time-estimate" id="time-estimate"></div>

      <div id="answer-area">
        <textarea id="answer-textarea" placeholder="Write your answer..."></textarea>
      </div>
      <div id="monaco-container" style="display:none;"></div>

      <div class="hint-box" id="hint-box">
        <div id="hint-text"></div>
        <div class="concepts" id="hint-concepts"></div>
        <a href="#" class="deep-dive-link" id="hint-deep-dive" style="display:none; margin-top: 10px; font-size: 0.85rem; color: var(--accent); text-decoration: none;">
          Deep Dive: Learn more about "<span id="hint-concept-name"></span>" →
        </a>
      </div>

      <div class="actions">
        <button id="prev-btn" disabled>← Back</button>
        <button id="hint-btn" class="warn">Show Hint</button>
        <div class="nav-spacer"></div>
        <button id="next-btn" class="">Next →</button>
      </div>
    </div>
  </div>

  <div id="completed-section" style="display:none;">
    <div class="completed-overlay">
      <h2>All questions answered</h2>
      <p>Ready to submit for evaluation?</p>
      <button class="primary" id="submit-btn" style="font-size:1rem; padding:12px 32px;">
        Submit for Evaluation
      </button>
    </div>
  </div>

  <script id="session-data" type="application/json">
  {
    "sessionId": {{ session_id }},
    "questions": {{ questions | tojson }},
    "answers": {{ answers | tojson }},
    "evaluated": {{ "true" if evaluated else "false" }}
  }
  </script>
  <script src="/static/interview.js"></script>
</body>
</html>
